name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: meter
          POSTGRES_PASSWORD: meter
          POSTGRES_DB: meter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meter -d meter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://meter:meter@localhost:5432/meter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up -d --build --wait
      - name: Smoke test
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS -X POST http://localhost:8000/readings \
            -H 'Content-Type: application/json' \
            -d '{"readings":[{"meter_id":"CI-1","ts":"2026-03-28T00:00:00+01:00","register_kwh":10.0}]}'
          curl -fsS "http://localhost:8000/anomalies?date=2026-03-28"
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - run: docker compose down -v
